<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toy Dəvətnamələri</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="site-header">
  <a class="brand" href="index.html">TOY DƏVƏTNAMƏLƏRİ</a>
  <a class="admin-link" href="admin.html">Admin</a>
</header>

<main>
  <section class="hero">
    <div class="hero-kicker">Rəqəmsal dəvətnamə kataloqu</div>
    <h1>Sizin özəl gününüz üçün<br><span>zərif dəvətnamələr</span></h1>
    <p>Hazır nümunələrə baxın və bəyəndiyiniz dizaynı seçin.</p>
  </section>

  <section class="catalog-wrap">
    <div class="section-head">
      <div>
        <div class="eyebrow">NÜMUNƏLƏR</div>
        <h2>Dəvətnamələr</h2>
      </div>
      <div class="filters">
        <button class="filter active" data-filter="all">Hamısı</button>
        <button class="filter" data-filter="toy">Toy</button>
        <button class="filter" data-filter="nisan">Nişan</button>
        <button class="filter" data-filter="adgunu">Ad günü</button>
      </div>
    </div>
    <div id="cards" class="grid"></div>
    <div id="empty" class="empty" hidden>Nümunə tapılmadı.</div>
  </section>
</main>

<footer class="footer">
  <div>TOY DƏVƏTNAMƏLƏRİ</div>
  <small>Rəqəmsal dəvətnamə nümunələri</small>
</footer>

<script>
let invitations = [];
let currentFilter = "all";

function esc(v) {
  return String(v ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function card(item) {
  const image = item.image
    ? `<img src="${esc(item.image)}" alt="${esc(item.title)}" loading="lazy">`
    : `<div class="preview-fallback ${esc(item.previewStyle || "classic")}">
         <span>${esc(item.previewTop || "DƏVƏTNAMƏ")}</span>
         <strong>${esc(item.names || item.title)}</strong>
         <em>${esc(item.date || "")}</em>
       </div>`;

  return `<article class="card" data-category="${esc(item.category || "toy")}">
    <div class="card-preview">${image}</div>
    <div class="card-body">
      <div class="tag">${esc(item.categoryLabel || item.category || "Toy")}</div>
      <h3>${esc(item.title)}</h3>
      <p>${esc(item.description || "")}</p>
      <a class="view-btn" href="${esc(item.file)}">Dəvətnaməyə bax <span>→</span></a>
    </div>
  </article>`;
}

function render() {
  const box = document.getElementById("cards");
  const list = invitations.filter(x => currentFilter === "all" || x.category === currentFilter);
  box.innerHTML = list.map(card).join("");
  document.getElementById("empty").hidden = list.length !== 0;
}

async function load() {
  try {
    const r = await fetch("data/invitations.json?ts=" + Date.now());
    if (!r.ok) throw new Error();
    invitations = await r.json();
    render();
  } catch {
    document.getElementById("cards").innerHTML =
      `<div class="empty">Nümunələr yüklənmədi. Bir neçə saniyə sonra yenidən yoxlayın.</div>`;
  }
}

document.querySelectorAll(".filter").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(x => x.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    render();
  });
});

load();
</script>
</body>
</html>
